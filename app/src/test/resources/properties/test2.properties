# Test 2 of the 5-test grading suite: Feature 1 (Throne Breaker) alone.
# Round 1 recreates the assignment spec's "Wizard Beats a Trump Card" example.
# Round 2 is a legal four-suit Revolution. The two Aces tie, so the last Ace
# played must win after suit priority is cancelled.
NumberOfRounds=3
StartCards=6
Simulation.period=100
Trick.delay=100
GameOver.delay=100
Mode=THRONE_BREAKER
Trump=HEARTS
WizardRank.round1=SEVEN
WizardRank.round2=EIGHT
WizardRank.round3=NINE
Deal.leadPlayer=0
AI.model=@preset/assignment
Deal.cards=0:CLUBS-KING,CLUBS-QUEEN,CLUBS-JACK,CLUBS-TEN,CLUBS-SEVEN,CLUBS-SIX;1:HEARTS-ACE,HEARTS-KING,HEARTS-QUEEN,HEARTS-JACK,CLUBS-ACE,DIAMONDS-THREE;2:SPADES-SEVEN,DIAMONDS-ACE,SPADES-SIX,SPADES-FIVE,CLUBS-NINE,HEARTS-TWO;3:SPADES-TWO,SPADES-ACE,SPADES-KING,SPADES-QUEEN,SPADES-JACK,SPADES-TEN
# The same six-card hand is carried through all three rounds.
Player0.type=RANDOM
Player0.isAuto=true
Player0.moves=CLUBS-KING,CLUBS-QUEEN,CLUBS-JACK
Player1.type=RANDOM
Player1.moves=HEARTS-ACE,HEARTS-KING,HEARTS-QUEEN
Player2.type=RANDOM
Player2.moves=SPADES-SEVEN,DIAMONDS-ACE,CLUBS-NINE
Player3.type=RANDOM
Player3.moves=SPADES-TWO,SPADES-ACE,SPADES-TEN
