# number of rounds in the game
NumberOfRounds=3
# how many cards each player starts with
StartCards=6

# for testing purpose, increase the value if you want the game to animate slower so you can watch what is going on
Simulation.period=100
Trick.delay=100
GameOver.delay=100
AI.model=@preset/assignment
# mode for the feature 1
Mode=THRONE_BREAKER

# trump card for all the rounds
Trump=HEARTS

# each round will have a different wizard rank, for feature 1.
#   If it is not specified, you need to randomly choose it
WizardRank.round1=SEVEN
WizardRank.round2=EIGHT
WizardRank.round3=NINE

# Who is the lead player in round 1, subsequent rounds will let the winner to lead
Deal.leadPlayer=0

# cards each player has in each round of dealing.
#   player 0: Club King, club queen, diamond king, diamond queen, heart king, heart queen
#   player 1: Club ACE, Club Two, Diamond Three, Diamond Two, Spade Two, Heart Two
Deal.cards=0:CLUBS-KING,CLUBS-QUEEN,DIAMONDS-KING,DIAMONDS-QUEEN,HEARTS-KING,HEARTS-QUEEN;1:CLUBS-ACE,CLUBS-TWO,DIAMONDS-THREE,DIAMONDS-TWO,SPADES-TWO,HEARTS-TWO;2:CLUBS-TEN,CLUBS-NINE,HEARTS-ACE,DIAMONDS-ACE,SPADES-FIVE,SPADES-SIX;3:SPADES-SEVEN,CLUBS-JACK,DIAMONDS-JACK,HEARTS-JACK,SPADES-TEN,DIAMONDS-TEN
# type can be HUMAN, RANDOM, HEURISTIC, AI
# filter: TRUMP_SAVING and NAIVE
Player0.type=HUMAN
Player1.type=HEURISTIC
Player1.filter=TRUMP_SAVING

# selection: AGGRESSIVE, EFFICIENT
Player1.selection=EFFICIENT
Player2.type=AI
AI.fallbackSelection=EFFICIENT
Player3.type=HEURISTIC
Player3.filter=NAIVE
Player3.selection=AGGRESSIVE
